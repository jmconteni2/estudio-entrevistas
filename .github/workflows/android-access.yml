name: Diagnóstico Brave Android
on:
  push:
    branches: [main]
    paths:
      - tests/test_android_access.py
      - .github/workflows/android-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/seal.mjs
        env:
          ESTUDIO_PASSWORD: abc
          ESTUDIO_TEST_BUILD: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - name: Permitir aceleración del emulador
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python tests/test_android_access.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics
          path: test-results/android/
          retention-days: 2
