<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Lumen Interview</title>
    <link rel="icon" type="image/webp" href="assets/lumi-icon.webp" />
    <link rel="apple-touch-icon" href="assets/lumi-icon.webp" />
    <link rel="stylesheet" href="style.css?v=0.6.1" />
    <script defer src="access.js?v=0.6.1"></script>
    <style>
      .access {
        max-width: 560px;
        margin: 10vh auto;
        padding: 20px;
      }
      .access .setup-card {
        padding: 36px;
        margin: 0;
      }
      #accessMessage {
        font-size: 13px;
        color: #93552e;
        margin-top: 14px;
      }
      #studio {
        display: block;
        width: 100%;
        height: 100dvh;
        border: 0;
      }
      #studio[hidden] {
        display: none;
      }
      .access h1 {
        font-size: 34px;
      }
      .access label {
        margin-top: 28px;
      }
      .password-entry { position: relative; }
      #password {
        position: relative;
        width: 100%;
        min-height: 52px;
        padding-right: 88px;
        font-size: 16px;
        appearance: none;
        -webkit-appearance: none;
        touch-action: manipulation;
        user-select: text;
        -webkit-user-select: text;
      }
      #showPassword {
        position: absolute;
        right: 5px;
        top: 5px;
        width: 76px;
        min-height: 42px;
        margin: 0;
        padding: 8px;
        color: #93552e;
        background: #fff1e2;
        border-radius: 9px;
        font-size: 12px;
      }
      @media (max-width: 640px) {
        .access {
          margin: 8vh auto;
          padding: 18px;
        }
        .access .setup-card {
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="access" id="accessPanel">
      <section class="setup-card">
        <img
          class="login-logo"
          src="assets/lumi-icon.webp"
          alt="Lumi con micrófono"
        />
        <div class="eyebrow">TU ESTUDIO DE ENTREVISTAS</div>
        <h1>Lumen Interview</h1>
        <p id="accessDescription" class="lead">
          Entra para preparar tu entrevista.
        </p>
        <form id="login">
          <label for="password">Contraseña</label>
          <div class="password-entry">
            <input id="password" name="password" type="password"
              autocomplete="current-password" autocapitalize="none"
              autocorrect="off" spellcheck="false" enterkeyhint="go"
              aria-label="Contraseña del anfitrión" required />
            <button id="showPassword" type="button" aria-controls="password"
              aria-pressed="false">Mostrar</button>
          </div>
          <button id="unlock" class="primary" type="submit">
            Entrar <span aria-hidden="true">→</span>
          </button>
        </form>
        <p id="accessMessage" role="status" aria-live="polite"></p>
      </section>
    </main>
    <iframe
      id="studio"
      name="studio"
      title="Lumen Interview"
      allow="camera; microphone; autoplay; clipboard-write; screen-wake-lock"
      hidden
    ></iframe>
  </body>
</html>
