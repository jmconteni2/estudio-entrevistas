<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Lumen Interview</title>
    <link rel="icon" type="image/webp" href="assets/lumi-icon.webp" />
    <link rel="apple-touch-icon" href="assets/lumi-icon.webp" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="access.js"></script>
    <style>
      .access {
        max-width: 560px;
        margin: 10vh auto;
        padding: 20px;
      }
      .access .setup-card {
        padding: 36px;
        margin: 0;
      }
      #accessMessage {
        font-size: 13px;
        color: #93552e;
        margin-top: 14px;
      }
      #studio {
        display: block;
        width: 100%;
        height: 100dvh;
        border: 0;
      }
      #studio[hidden] {
        display: none;
      }
      .access h1 {
        font-size: 34px;
      }
      .access label {
        margin-top: 28px;
      }
      @media (max-width: 640px) {
        .access {
          margin: 8vh auto;
          padding: 18px;
        }
        .access .setup-card {
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="access" id="accessPanel">
      <section class="setup-card">
        <img
          class="login-logo"
          src="assets/lumi-icon.webp"
          alt="Lumi con micrófono"
        />
        <div class="eyebrow">TU ESTUDIO DE ENTREVISTAS</div>
        <h1>Lumen Interview</h1>
        <p id="accessDescription" class="lead">
          Entra para preparar tu entrevista.
        </p>
        <form id="login">
          <label
            >Contraseña<input
              id="password"
              type="password"
              autocomplete="current-password"
              required
              autofocus /></label
          ><button id="unlock" class="primary" type="submit">
            Entrar <span aria-hidden="true">→</span>
          </button>
        </form>
        <p id="accessMessage" role="status" aria-live="polite"></p>
      </section>
    </main>
    <iframe
      id="studio"
      name="studio"
      title="Lumen Interview"
      allow="camera; microphone; autoplay; clipboard-write; screen-wake-lock"
      hidden
    ></iframe>
  </body>
</html>
