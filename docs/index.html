<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Lumen Interview</title>
    <link rel="icon" type="image/webp" href="assets/lumi-icon.webp" />
    <link rel="apple-touch-icon" href="assets/lumi-icon.webp" />
    <script defer src="access.js?v=0.7.1"></script>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #211b16; background: #fff1e2; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; }
      .access { max-width: 560px; margin: 8vh auto; padding: 20px; }
      .setup-card { padding: 36px; background: white; border: 1px solid #ebd8c8; border-radius: 26px; box-shadow: 0 18px 60px #50351e0a; }
      .login-logo { width: 78px; height: 78px; border-radius: 20px; margin-bottom: 24px; }
      .eyebrow { color: #e96c05; font-size: 10px; font-weight: 750; letter-spacing: .18em; margin-bottom: 18px; }
      h1 { margin: 0 0 18px; font-size: 34px; line-height: 1.15; letter-spacing: -1px; }
      .lead { color: #827367; font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
      #hostAccess { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 52px; margin-top: 12px; padding: 14px 18px; border: 0; border-radius: 13px; color: white; background: #f58012; }
      #hostAccess:disabled { opacity: .65; }
      #accessMessage { font-size: 13px; line-height: 1.5; color: #93552e; margin: 14px 0 0; }
      #studio { display: block; width: 100%; height: 100dvh; border: 0; }
      @media (max-width: 640px) { .access { padding: 18px; } .setup-card { padding: 28px; } }
    </style>
  </head>
  <body>
    <main class="access" id="accessPanel">
      <section class="setup-card">
        <img
          class="login-logo"
          src="assets/lumi-icon.webp"
          alt="Lumi con micrófono"
        />
        <div class="eyebrow">TU ESTUDIO DE ENTREVISTAS</div>
        <h1>Lumen Interview</h1>
        <p id="accessDescription" class="lead">
          Entra para preparar tu entrevista.
        </p>
        <button id="hostAccess" type="button">
          Entrar como anfitrión <span aria-hidden="true">→</span>
        </button>
        <p id="accessMessage" role="status" aria-live="polite"></p>
      </section>
    </main>

  </body>
</html>
